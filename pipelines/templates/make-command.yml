parameters:
- name: makeCommand
  displayName: 'The make command to run'
  type: string
- name: displayName
  displayName: 'The display name of the step'
  type: string
- name: force
  displayName: 'Whether to force the step to run'
  type: boolean
  default: false
  
steps:
# - bash: |
#     set -e
#     # Debug step to print DEFAULT_LANGUAGE environment variable
#     echo "DEFAULT_LANGUAGE: $DEFAULT_LANGUAGE"
#   env:
#     DEFAULT_LANGUAGE: $(DEFAULT_LANGUAGE)
- bash: |
    set -e
    docker run --rm \
      --env-file '$(Build.SourcesDirectory)/pipelines/devcontainer-ci.env' \
      --mount "type=bind,src=$(Build.SourcesDirectory),dst=/workspaces/info-asst" \
      -v /var/run/docker.sock:/var/run/docker.sock \
      --workdir /workspaces/info-asst \
      --user vscode \
      'info-asst-devcontainer:$(Build.BuildId)' \
      bash -c -i "make ${{ parameters.makeCommand }}"
  displayName: ${{ parameters.displayName }}
  condition: or(succeeded(), eq('${{ parameters.force }}', 'true'))
  env: 
    ARM_CLIENT_ID: $(CLIENT_ID)
    ARM_CLIENT_SECRET: $(CLIENT_SECRET)
    ARM_SERVICE_PRINCIPAL_ID: $(SERVICE_PRINCIPAL_ID)
    ARM_TENANT_ID: $(TENANT_ID)
    ARM_SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)
    AD_WEBAPP_CLIENT_ID: $(WEBAPP_CLIENT_ID)
    AZURE_OPENAI_SERVICE_NAME: $(AZURE_OPENAI_SERVICE_NAME)
    AZURE_OPENAI_RESOURCE_GROUP: $(AZURE_OPENAI_RESOURCE_GROUP)
    AZURE_OPENAI_CHATGPT_DEPLOYMENT: $(AZURE_OPENAI_CHATGPT_DEPLOYMENT)
    AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME: $(AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME)
    AD_MGMTAPP_CLIENT_ID: $(AD_MGMTAPP_CLIENT_ID)
    AD_MGMTAPP_CLIENT_SECRET: $(AD_MGMTAPP_CLIENT_SECRET)
    AD_MGMT_SERVICE_PRINCIPAL_ID: $(AD_MGMT_SERVICE_PRINCIPAL_ID)
    DEFAULT_LANGUAGE: $(DEFAULT_LANGUAGE)
    # Add all needed variables to deploy
    LOCATION: $(LOCATION)
    WORKSPACE: $(WORKSPACE)
    SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)
    BRING_YOUR_OWN_VNET: $(BRING_YOUR_OWN_VNET)
    SPOKE_RESOURCE_GROUP_NAME: $(SPOKE_RESOURCE_GROUP_NAME)
    RESOURCES_RESOURCE_GROUP_NAME: $(RESOURCES_RESOURCE_GROUP_NAME)
    OPENAI_REGION: $(OPENAI_REGION)
    VNET_NAME: $(VNET_NAME)
    WEB_SUBNET_NAME: $(WEB_SUBNET_NAME)
    WEB_SUBNET_INTEGRATION_NAME: $(WEB_SUBNET_INTEGRATION_NAME)
    SUBNET_SERVICE_NAME: $(SUBNET_SERVICE_NAME)
    SUBNET_DATA: $(SUBNET_DATA)
    SUBNET_OPENAI: $(SUBNET_OPENAI)
    DNS_SUBNET_NAME: $(DNS_SUBNET_NAME)
    AZURE_ENVIRONMENT: "AzureCloud"
    SECURE_MODE: true
    REQUIRE_WEBSITE_SECURITY_MEMBERSHIP: true
    ENABLE_WEB_CHAT: false
    ENABLE_UNGROUNDED_CHAT: false
    ENABLE_MATH_ASSISTANT: false
    ENABLE_TABULAR_DATA_ASSISTANT: false
    ENABLE_SHAREPOINT_CONNECTOR: false
    SECRET_EXPIRATION_DAYS: 730
    USE_EXISTING_AOAI: false
    USE_AZURE_OPENAI_EMBEDDINGS: true
    AZURE_OPENAI_CHATGPT_MODEL_CAPACITY: 240
    AZURE_OPENAI_EMBEDDINGS_MODEL_CAPACITY: 240
    ENABLE_CUSTOMER_USAGE_ATTRIBUTION: true
    CUSTOMER_USAGE_ATTRIBUTION_ID: "7a01ff74-15c2-4fec-9f14-63db7d3d6131"
    ENABLE_DEV_CODE: false
    PASSWORD_LIFETIME: 365
    ENABLE_DDOS_PROTECTION_PLAN: false
    # END ADDED VARIABLES
    BUILD_BUILDID: $(Build.BuildId)
    BUILD_BUILDNUMBER: $(Build.BuildNumber)
    TF_BACKEND_RESOURCE_GROUP: $(TF_BACKEND_RESOURCE_GROUP)
    TF_BACKEND_STORAGE_ACCOUNT: $(TF_BACKEND_STORAGE_ACCOUNT)
    TF_BACKEND_CONTAINER: $(TF_BACKEND_CONTAINER)
    TF_BACKEND_ACCESS_KEY: $(TF_BACKEND_ACCESS_KEY)
