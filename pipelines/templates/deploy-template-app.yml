# Template for deploy pipeline. Modify and add steps here.
parameters:
- name: fullBuild  
  type: boolean
  default: true

steps:
- bash: |
    sudo chown -R $(whoami) .
  displayName: Take ownership of Directory

- checkout: self
  clean: true

# - bash: |
