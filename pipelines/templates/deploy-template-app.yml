#   displayName: 'Azure Login'

- bash: |
    docker login $(CONTAINER_REGISTRY_ADDRESS) -u $(CONTAINER_REGISTRY_USERNAME) -p $(CONTAINER_REGISTRY_PASSWORD)
    docker pull $(CONTAINER_REGISTRY_ADDRESS)/info-asst-devcontainer:latest
  displayName: Pull latest dev container from container registry for layer caching
  continueOnError: false # for first build, no cache

