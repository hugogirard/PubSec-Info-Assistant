trigger:
  batch: true
  branches:
    include: [ add-different-rg-features ]

pr: none

stages:
- stage: Deploy
  variables:
  - group: pubsec
  jobs:

  - deployment: Shared
    timeoutInMinutes: 120
    pool:
      name: 'default'
    strategy:
        runOnce:    #rolling, canary are the other strategies that are supported
          deploy:
            steps:
            - template: templates/deploy-template.yml